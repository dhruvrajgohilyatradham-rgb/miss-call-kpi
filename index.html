<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miss Call KPI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--mut:#8a93a6;--line:#eceef3;--good:#16a34a;--bad:#dc2626;--acc:#2563eb}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f7f8fb;font-size:14px;padding:48px 20px}
.page{max-width:820px;margin:0 auto;background:#fff;border-radius:20px;padding:36px 40px;box-shadow:0 1px 3px rgba(16,24,40,.05),0 12px 40px rgba(16,24,40,.05)}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--mut);margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;margin:28px 0 20px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:#f1f3f8;border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:8px;font:500 13.5px Inter,sans-serif;color:var(--mut);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}
select{font:500 13.5px Inter,sans-serif;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.copy{margin-left:auto;border:0;background:none;color:var(--acc);font:500 13px Inter,sans-serif;cursor:pointer;padding:8px 4px}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-weight:500;font-size:12.5px;color:var(--mut);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:16px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td.n{font-weight:600}
td small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.r{font-weight:700}
.up{color:var(--good);font-weight:600}.dn{color:var(--bad);font-weight:600}.no{color:var(--mut)}
tr.tot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--ink);padding-top:16px}
.foot{margin-top:22px;color:var(--mut);font-size:12.5px}
.note{background:#fff7e0;color:#8a6100;border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}
.chart{width:100%;height:auto;margin-top:34px;display:block}.gl{stroke:#eef0f5}.ax{font-size:11px;fill:var(--mut)}.bx{fill:#dbe6fd}.ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.dot{fill:#fff;stroke:var(--acc);stroke-width:2.5}.lb{font-size:11.5px;font-weight:600;fill:var(--ink)}
.leg{display:flex;gap:18px;font-size:12.5px;color:var(--mut);margin-top:6px;justify-content:center}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;background:#dbe6fd;margin-right:6px;vertical-align:-1px}.leg i.l{background:var(--acc);height:3px;vertical-align:3px}
.hide{display:none}
@media(max-width:600px){.page{padding:24px 18px}.copy{margin-left:0}}
</style>
</head>
<body>
<div class="page">
 <h1>Miss Call KPI</h1>
 <p class="sub" id="upd">Loading…</p>
 <div class="bar">
  <div class="tabs"><button class="on" data-t="w">Weeks</button><button data-t="m">Months</button></div>
  <select id="sm" aria-label="Month"></select>
  <select id="sn" aria-label="Days per period"></select>
  <button class="copy" id="cp">Copy table</button>
 </div>
 <div id="note"></div>
 <div class="scroll"><table id="tb"></table></div>
 <div id="ch"></div>
 <div class="leg"><span><i></i>Miss calls per day</span><span><i class="l"></i>Ratio %</span></div>
 <p class="foot">Ratio = Bookings ÷ Miss calls. pp = percentage points change from the previous row.</p>
</div>
<script>
const URL_='https://opensheet.elk.sh/1Qbx7iMZdsJXh8Rj_Vf9VNuoMBZiXZxW2_Dq8AIGBEgM/Daily';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const num=v=>parseFloat(String(v==null?'':v).replace(/,/g,''))||0;
const fmt=n=>Math.round(n).toLocaleString('en-IN');
let DATA=[],MONTHS=[],tab='w';
function norm(r){const k={};for(const x in r)k[x.trim().toLowerCase()]=r[x];
  const p=String(k.date||'').trim().split('-');if(p.length<3)return null;
  const d=+p[0],m=MON.findIndex(x=>x.toLowerCase()===p[1].slice(0,3).toLowerCase()),y=+p[2];
  if(!d||m<0||!y)return null;
  return{d,m,y,key:y*100+m,miss:num(k['unique miss call']),book:num(k['total booking by miss call'])}}
function agg(r){const miss=r.reduce((a,x)=>a+x.miss,0),book=r.reduce((a,x)=>a+x.book,0);return{miss,book,days:r.length,per:r.length?miss/r.length:0,ratio:miss?book/miss*100:0}}
const label=k=>MON[k%100]+' '+Math.floor(k/100);
const rowsOf=k=>DATA.filter(r=>r.key===k).sort((a,b)=>a.d-b.d);
const mLen=k=>new Date(Math.floor(k/100),k%100+1,0).getDate();
function delta(c,p){if(p==null)return'<span class="no">–</span>';const d=c-p;
  if(Math.abs(d)<.005)return'<span class="no">0.00 pp</span>';
  return d>0?`<span class="up">▲ +${d.toFixed(2)} pp</span>`:`<span class="dn">▼ −${Math.abs(d).toFixed(2)} pp</span>`}
function row(a,b,c,x,prev){return`<tr><td class="n">${a}${b?`<small>${b}</small>`:''}</td><td>${c}</td><td>${fmt(x.miss)}</td><td>${fmt(x.per)}</td><td>${fmt(x.book)}</td><td class="r">${x.ratio.toFixed(2)}%</td><td>${delta(x.ratio,prev)}</td></tr>`}
function chart(it){
  if(!it.length)return'';
  const W=700,H=250,pl=44,pr=40,pt=24,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  const mb=Math.max(...it.map(x=>x.bar))||1,ml=(Math.max(...it.map(x=>x.line))*1.3)||1,bw=iw/it.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Trend chart">`;
  for(let i=0;i<=3;i++){const y=pt+ih-ih*i/3;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-8}" y="${y+4}" class="ax" text-anchor="end">${fmt(mb*i/3)}</text><text x="${W-pr+8}" y="${y+4}" class="ax">${(ml*i/3).toFixed(0)}%</text>`}
  const pts=[];
  it.forEach((x,i)=>{const h=ih*x.bar/mb,cx=pl+bw*i+bw/2;
    s+=`<rect x="${cx-Math.min(bw*.3,26)}" y="${pt+ih-h}" width="${Math.min(bw*.6,52)}" height="${h}" rx="6" class="bx"/><text x="${cx}" y="${H-8}" class="ax" text-anchor="middle">${x.label}</text>`;
    pts.push([cx,pt+ih-ih*x.line/ml,x.line])});
  s+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" class="ln"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="dot"/><text x="${p[0]}" y="${p[1]-10}" class="lb" text-anchor="middle">${p[2].toFixed(2)}%</text>`).join('')+'</svg>';
  return s}
function render(){
  const isW=tab==='w';
  $('sm').classList.toggle('hide',!isW);$('sn').classList.toggle('hide',!isW);
  let h='<thead><tr><th>'+(isW?'Week':'Month')+'</th><th>Days</th><th>Miss calls</th><th>Per day</th><th>Bookings</th><th>Ratio</th><th>Change</th></tr></thead><tbody>',all;
  if(isW){
    const k=+$('sm').value,N=+$('sn').value,rows=rowsOf(k),len=mLen(k),out=[];
    for(let i=0;i<rows.length;i+=N){const g=rows.slice(i,i+N);out.push({...agg(g),a:g[0].d,b:g[g.length-1].d})}
    out.forEach((x,i)=>{const part=x.days<N&&x.b<len;
      h+=row((N===7?'Week ':'Period ')+(i+1),`${x.a}–${x.b} ${MON[k%100]}${part?' · in progress':''}`,x.days,x,i?out[i-1].ratio:null)});
    $('ch').innerHTML=chart(out.map((x,i)=>({label:(N===7?'W':'P')+(i+1),bar:x.per,line:x.ratio})));
    all=agg(rows);
    h+=row('Total',`1–${rows.length?rows[rows.length-1].d:''} ${MON[k%100]}`,all.days,all,null).replace('<tr>','<tr class="tot">').replace('<span class="no">–</span></td></tr>','</td></tr>');
  }else{
    const list=MONTHS.map(k=>({k,...agg(rowsOf(k))}));
    $('ch').innerHTML=chart(list.map(x=>({label:label(x.k),bar:x.per,line:x.ratio})));
    list.forEach((x,i)=>{h+=row(label(x.k),x.days<mLen(x.k)?'in progress':'',x.days,x,i?list[i-1].ratio:null)});
  }
  $('tb').innerHTML=h+'</tbody>';
}
$('sm').onchange=$('sn').onchange=render;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
$('cp').onclick=()=>{const t=[...$('tb').rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n');
  const done=()=>{$('cp').textContent='Copied ✓';setTimeout(()=>$('cp').textContent='Copy table',1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done);
  else{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();done()}};
const DEMO='1190,118;2309,167;1223,106;880,75;731,72;781,77;708,83;438,41;499,67;563,71;449,65;382,39;383,48;376,43;402,55;376,48;2002,229;484,55;565,58;439,59;405,57;625,74;700,78;721,80';
async function load(){
  try{const r=await fetch(URL_);if(!r.ok)throw 0;DATA=(await r.json()).map(norm).filter(Boolean);if(!DATA.length)throw 0}
  catch(e){DATA=DEMO.split(';').map((s,i)=>{const v=s.split(',');return{d:i+1,m:9,y:2026,key:202609,miss:+v[0],book:+v[1]}});
    $('note').innerHTML='<div class="note">Live sheet could not be loaded, so sample numbers are shown. Open this file with internet from your website or GitHub Pages.</div>'}
  MONTHS=[...new Set(DATA.map(r=>r.key))].sort((a,b)=>a-b);
  $('sm').innerHTML=MONTHS.slice().reverse().map(k=>`<option value="${k}">${label(k)}</option>`).join('');
  $('sn').innerHTML=[3,4,5,6,7,10,14].map(n=>`<option value="${n}" ${n===7?'selected':''}>${n} days</option>`).join('');
  const lr=rowsOf(MONTHS[MONTHS.length-1]).pop();$('upd').textContent='Data up to '+lr.d+' '+MON[lr.m]+' '+lr.y;
  render();
}
load();
</script>
</body>
</html>
